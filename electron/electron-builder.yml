appId: com.echo.app
productName: Echo
copyright: Copyright © 2024 Echo Team

publish:
  provider: github
  owner: xiaobaoliu849
  repo: echo
  releaseType: release

directories:
  output: dist
  buildResources: .

# Files packed into the ASAR (relative to the electron/ dir)
files:
  - main.js
  - backend-runtime.js
  - preload.js
  - package.json
  - node_modules/**

# Extra resources placed alongside the ASAR (not inside it)
extraResources:
  - from: ../frontend/dist
    to: frontend/dist
  - from: ../resources
    to: resources
    filter:
      - icons/logo.ico
      - icons/logo.png
  - from: ../backend/dist/voicespirit-backend
    to: backend-dist
  - from: node_modules/ffmpeg-static/ffmpeg.exe
    to: media-tools/ffmpeg.exe
  - from: node_modules/ffprobe-static/bin/win32/x64/ffprobe.exe
    to: media-tools/ffprobe.exe
  - from: node_modules/ffmpeg-static/ffmpeg.exe.LICENSE
    to: media-tools/ffmpeg.LICENSE
  - from: node_modules/ffmpeg-static/ffmpeg.exe.README
    to: media-tools/ffmpeg.README
  - from: node_modules/ffprobe-static/LICENSE
    to: media-tools/ffprobe.LICENSE

win:
  icon: ../resources/icons/logo.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  differentialPackage: true
